services:
  test:
    build: .
    image: layermap-dev:local
    working_dir: /workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/workspace:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, -m, unittest, -v, test_generate_diagram.py]
  generate:
    build: .
    image: layermap-dev:local
    working_dir: /workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/workspace:ro
      - ./artifacts:/output
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, generate_diagram.py, lan-sample.yaml, -o, /output/lan-sample.svg]

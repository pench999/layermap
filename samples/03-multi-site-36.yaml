  - "機器情報はすべて架空です。3拠点×12台＝36台のため、全体表示では描画上限の案内が出ます。"
  - "表示範囲の拠点で「本社」を選ぶと12台、さらに機器群「業務端末」を選ぶと6台になります。"
  - "拠点をすべてへ戻し、機器群「ネットワーク機器」を選ぶと3拠点の9台を比較できます。"
  - "フロアA・フロアBは役割別の機器群と重複する所属の例です。絞り込みで範囲外となるケーブルは画面の一覧で確認できます。"
  - "各拠点は別のVLAN・IPサブネットです。WAN側・NAT・拠点間回線・通信の許可設定は定義していません。"

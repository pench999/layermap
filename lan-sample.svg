<text x="40" y="2002" font-size="20" fill="#23344d">L3経路（矢印は次ホップ指定。通信許可を意味しません）</text>
<text x="40" y="2030" font-size="14" fill="#23344d">pc-a / pc-a.ip : 0.0.0.0/0 → 192.168.10.1</text>
<text x="40" y="2054" font-size="14" fill="#23344d">pc-b / pc-b.ip : 0.0.0.0/0 → 192.168.20.1</text>
<text x="40" y="2093" font-size="13" fill="#23344d">注：ゲートウェイのWAN側、NAT、DNS、DHCP、管理IPは今回の範囲外。</text>
<text x="40" y="2117" font-size="13" fill="#23344d">注：経路の存在は通信許可を意味しない。VLAN間および外部向けの許可規則は未定義。</text>
<text x="40" y="2141" font-size="13" fill="#23344d">注：VLANとサブネットを1対1にするのはこの例の設計であり、スキーマの一般的制約ではない。</text>
<text x="40" y="2175" font-size="13" fill="#23344d">実線：各層の関係（L3＝サブネット所属、L2＝VLAN所属・ブリッジ、L1＝ケーブル） / 紫破線：層間対応</text></svg>
